<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Xerox Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <a href="/admin/xerox-orders" class="btn btn-primary mb-4">
        ⬅ Back
    </a>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                🖨 Xerox Order Details
            </h3>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Customer Name</label>

                    <input
                        class="form-control"
                        value="{{ order.customer_name }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Mobile Number</label>

                    <input
                        class="form-control"
                        value="{{ order.mobile }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Paper Size</label>

                    <input
                        class="form-control"
                        value="{{ order.paper_size }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Print Type</label>

                    <input
                        class="form-control"
                        value="{{ order.print_type }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Print Side</label>

                    <input
                        class="form-control"
                        value="{{ order.print_side }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="fw-bold">Copies</label>

                    <input
                        class="form-control"
                        value="{{ order.copies }}"
                        readonly>

                </div>

            </div>

            <div class="mb-3">

                <label class="fw-bold">
                    Instructions
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    readonly>{{ order.instructions }}</textarea>

            </div>

            <div class="mb-3">

                <label class="fw-bold">
                    Current Status
                </label>

                <br>

                <span class="badge bg-warning fs-6">

                    {{ order.status }}

                </span>

            </div>

            <div class="mb-4">

                <label class="fw-bold">
                    Uploaded PDF
                </label>

                <br><br>

                {% if order.document %}

                <a
                    href="{{ url_for('static', filename='uploads/' + order.document) }}"
                    target="_blank"
                    class="btn btn-danger">

                    📄 Open PDF

                </a>

                {% else %}

                <p class="text-danger">

                    No PDF Uploaded

                </p>

                {% endif %}

            </div>

            <h5 class="mb-3">

                Update Status

            </h5>

            <div class="d-flex gap-2 flex-wrap">

                <a href="/update-status/{{ order.id }}/Pending"
                   class="btn btn-warning">

                    Pending

                </a>

                <a href="/update-status/{{ order.id }}/Printing"
                   class="btn btn-info text-white">

                    Printing

                </a>

                <a href="/update-status/{{ order.id }}/Ready"
                   class="btn btn-primary">

                    Ready

                </a>

                <a href="/update-status/{{ order.id }}/Completed"
                   class="btn btn-success">

                    Completed

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
