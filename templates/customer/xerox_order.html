{% extends "layout/base.html" %}

{% block title %}
Xerox Order | KS Xerox
{% endblock %}

{% block content %}

<section class="py-5" style="background:#f5f9ff; min-height:100vh;">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold text-primary">
                🖨️ Xerox & Printing Order
            </h1>

            <p class="text-muted">
                Upload your document and choose your printing options.
            </p>

        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <form action="/submit-xerox-order"
                              method="POST"
                              enctype="multipart/form-data">

                            <!-- Customer Name -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Customer Name
                                </label>

                                <input
                                    type="text"
                                    name="customer_name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>

                            <!-- Mobile Number -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    name="mobile"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    required>

                            </div>

                            <!-- Upload Document -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Upload Document
                                </label>

                                <input
                                    type="file"
                                    name="document"
                                    class="form-control"
                                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                                    required>

                            </div>
                                                        <!-- Paper Size & Print Type -->

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Paper Size
                                    </label>

                                    <select
                                        class="form-select"
                                        name="paper_size"
                                        required>

                                        <option value="">Select Paper Size</option>
                                        <option value="A4">A4</option>
                                        <option value="A3">A3</option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Print Type
                                    </label>

                                    <select
                                        class="form-select"
                                        name="print_type"
                                        required>

                                        <option value="">Select Print Type</option>
                                        <option value="Black & White">
                                            Black & White
                                        </option>

                                        <option value="Color">
                                            Color
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- Print Side & Copies -->

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Print Side
                                    </label>

                                    <select
                                        class="form-select"
                                        name="print_side"
                                        required>

                                        <option value="">Select Print Side</option>

                                        <option value="Single Side">
                                            Single Side
                                        </option>

                                        <option value="Double Side">
                                            Double Side
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Number of Copies
                                    </label>

                                    <input
                                        type="number"
                                        name="copies"
                                        class="form-control"
                                        value="1"
                                        min="1"
                                        required>

                                </div>

                            </div>

                            <!-- Instructions -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Additional Instructions
                                </label>

                                <textarea
                                    class="form-control"
                                    name="instructions"
                                    rows="4"
                                    placeholder="Example: Print pages 5-10 only"></textarea>

                            </div>
                                                        <!-- Submit Button -->

                            <div class="text-center mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg px-5">

                                    📤 Submit Order

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
