{% extends "layout/base.html" %}

{% block title %}
Xerox Order | KS Xerox
{% endblock %}

{% block content %}

<section class="py-5" style="background:#f5f9ff; min-height:100vh;">

    <div class="container">

        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">🖨️ Xerox & Printing Order</h1>
            <p class="text-muted">
                Upload your document and choose your printing options.
            </p>
        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <form action="#" method="POST" enctype="multipart/form-data">

                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Customer Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    required>
                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Upload Document
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                                    required>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Paper Size
                                    </label>

                                    <select class="form-select">

                                        <option>A4</option>
                                        <option>A3</option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Print Type
                                    </label>

                                    <select class="form-select">

                                        <option>Black & White</option>
                                        <option>Color</option>

                                    </select>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Print Side
                                    </label>

                                    <select class="form-select">

                                        <option>Single Side</option>
                                        <option>Double Side</option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-bold">
                                        Number of Copies
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        value="1"
                                        min="1">

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Additional Instructions
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="4"
                                    placeholder="Example: Print pages 5-10 only"></textarea>

                            </div>

                            <div class="text-center mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg px-5">

                                    📤 Submit Order

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
