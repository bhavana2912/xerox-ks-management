<form
action="/submit-online-service"
method="POST"
enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label fw-bold">
Customer Name
</label>

<input
type="text"
name="customer_name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
Mobile Number
</label>

<input
type="tel"
name="mobile"
class="form-control"
placeholder="Enter mobile number"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
Select Service
</label>

<select
name="service"
class="form-select">

<option>Aadhaar Services</option>
<option>PAN Card</option>
<option>Passport Application</option>
<option>College Application</option>
<option>Government Forms</option>
<option>Train Ticket Booking</option>
<option>Bus Ticket Booking</option>
<option>Flight Ticket Booking</option>

</select>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
Upload Required Documents
</label>

<input
type="file"
name="document"
class="form-control">

</div>
<div class="mb-3">

<label class="form-label fw-bold">
Additional Notes
</label>

<textarea
name="notes"
class="form-control"
rows="4"
placeholder="Enter additional details if required"></textarea>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-success btn-lg px-5">

🌐 Submit Request

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
